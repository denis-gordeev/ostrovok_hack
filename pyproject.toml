[project]
name = "hotel-agent"
version = "0.1.0"
description = "LangGraph-агент подбора отелей в Татарстане с оценкой шума и событиями в Казани"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langmem>=0.0.30,<0.1",
    "beautifulsoup4>=4.12,<5",
    "langchain-graph-retriever>=0.8,<1",
    "mwparserfromhell>=0.7,<1",
    "snowballstemmer>=3,<4",
    "faiss-cpu>=1.9,<2",
    "pystemmer>=2.2,<4",
    "fastapi>=0.115,<1",
    "h3>=4.5",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.6",
    "langchain-openai>=1.0,<2",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.17,<2",
    "langgraph-cli[inmem]>=0.4.38",
    "numpy>=2.5",
    "osmnx>=2.0,<3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyproj>=3.8",
    "python-dotenv>=1.2.4,<2",
    "requests-cache>=1.2,<2",
    "shapely>=2.2",
    "uvicorn>=0.30,<1",
    "ddgs>=9,<10",
]

[project.scripts]
hotel-agent = "hotel_agent.cli:main"
ostrovok-scrape = "ostrovok_scraper.cli:main"
kazan-noise = "kazan_noise.cli:main"
kudago-events = "kudago_events.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotel_agent", "src/ostrovok_scraper", "src/kazan_noise", "src/kudago_events"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Модули гео-агента (map_tools, transit_routing, scripts/…) лежат в корне, а не в пакете.
pythonpath = ["."]
markers = ["db: нужен Postgres (OSTROVOK_TEST_DSN)"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
