server {
    listen 443 ssl;
    server_name 188.241.197.121;
    ssl_certificate /etc/letsencrypt/live/langgraph-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/langgraph-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;

    location / {
        # Browser CORS preflights have no credentials; API requests do.
        limit_except OPTIONS {
            auth_basic "Kazan LangGraph";
            auth_basic_user_file /etc/nginx/langgraph.htpasswd;
        }
        proxy_pass http://langgraph:2024;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Validate at the gateway; don't pass the password into the graph server.
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
