services:
  langgraph:
    build: .
    restart: unless-stopped
    command:
      - langgraph
      - dev
      - --config
      - langgraph.server.json
      - --host
      - 0.0.0.0
      - --port
      - "2024"
      - --no-browser
      - --no-reload
      - --allow-blocking
      - --n-jobs-per-worker
      - "1"
    env_file:
      - ./.env
    environment:
      OVERPASS_URL: http://overpass/api
      OSMNX_API_URL: http://app:8080
      EMBEDDINGS_URL: http://embeddings:8082
      OVERPASS_RATE_LIMIT: "false"
      REQUEST_TIMEOUT: "120"
      LANGSMITH_TRACING: "false"
    volumes:
      - ./.cache/langgraph:/app/.langgraph_api
      - ./.cache/server:/app/.cache
    depends_on:
      overpass:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2024/ok', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  langgraph-gateway:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    ports:
      - "0.0.0.0:8443:443"
    volumes:
      - ./deploy/langgraph-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.secrets/langgraph.htpasswd:/etc/nginx/langgraph.htpasswd:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      langgraph:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
